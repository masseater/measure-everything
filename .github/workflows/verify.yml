name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gh auth setup-git
          commits="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA" --jq .total_commits)"
          git fetch --no-tags --depth="$((commits + 1))" origin "$HEAD_SHA"
          vp exec commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/oxlint-plugin-decision
          key: oxlint-plugin-decision-${{ github.sha }}
          restore-keys: oxlint-plugin-decision-
      - if: github.event_name == 'push'
        run: vp run gitleaks
        env:
          GITLEAKS_BASE: ${{ github.event.before }}
      - id: verify
        run: vp run --log grouped verify
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: always() && steps.verify.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/oxlint-plugin-decision
          key: oxlint-plugin-decision-${{ github.sha }}

  autofix:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_RUN_ID: ${{ github.run_id }}
        run: >-
          gh workflow run autofix.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          -f run_id="$FAILED_RUN_ID" -f branch="$HEAD_BRANCH" -f sha="$HEAD_SHA"

  release:
    needs: verify
    if: github.repository == 'masseater/measure-everything'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: release
    steps:
      - id: tagged
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-pull-request: true
      - if: github.event_name == 'workflow_dispatch'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-release: true
      - if: steps.tagged.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tagged.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"

  ci-telemetry:
    needs: [verify, autofix, release]
    if: always() && vars.OTEL_EXPORTER_OTLP_ENDPOINT != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: corentinmusard/otel-cicd-action@4826b79d63662fa91657272e7711420cb6aea543 # v4.2.0
        with:
          otlpEndpoint: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          otelServiceName: ${{ github.repository }}
          githubToken: ${{ github.token }}
